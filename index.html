<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/Logo_bright.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portfolio-carina-hollinger</title>
  <script type="module" crossorigin src="/assets/index-BXr3B3iL.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/vendor-three-CErL6X5l.js">
  <link rel="stylesheet" crossorigin href="/assets/index-DhhP3FMa.css">
</head>

<body>
  <div class="titleColor">
    <div class="webButtonContainer">
      <div class="webTitleContainer">
        <img src="/Logo_bright.svg" alt="Logo" class="Logo">
        <img src="/SchriftzugPortfolio_03_weiß.svg" alt="Logo" class="webTitle">
      </div>
      <button class="portfolioButton" data-target="portfolioContainer" data-key="portfolioButton">
        <div class="right-arrow"></div>
        <span>to the portfolio</span>
      </button>
    </div>
    <div class="down-arrow"></div>
    <button id='langBtn' class="langBtn" data-key="languageButton">Deutsch</button>
  </div>


  <nav>
    <button class="nav-btn" data-target="portfolioContainer" data-key="portfolio">Portfolio</button>
    <button class="nav-btn selected" data-target="about" data-key="about">About</button>
    <button class="nav-btn" data-target="contact" data-key="contact">Contact</button>
  </nav>

  <div class="socialContainer">
    <a class="navLink" href="https://www.instagram.com/c.h.visuals?igsh=ZXNhaDlxMGN2d2l6" target="_blank"
      aria-label="Visit me on Instagram">
      <img src="/Instagram_Glyph_White.svg" alt="Instagram Profile Link" style="width: 29px; height: 29px;" />
    </a>
    <a class="navLink" href="https://www.linkedin.com/in/carina-hollinger/" target="_blank"
      aria-label="Visit me on LinkedIn">
      <img src="/InBug-White.png" alt="Instagram Profile Link" style="width: 29px; height: 29px;" />
    </a>
  </div>
  <main>
    <section id="portfolioContainer">
      <div id="portfolio"></div>
    </section>

    <section id="about" class="active">
      <div class="about"></div>
    </section>

    <section id="impressum" >
      <div class="impressum"></div>
    </section>

    <section id="contact">
      <div class="contactWrapper">
        <form id="contactForm" class="contactForm" action="https://formspree.io/f/xjkjdapo" method="POST">
          <input type="text" data-key="name" name="name" placeholder="Name" required>
          <input type="email" data-key="email" name="email" placeholder="Email" required>
          <textarea data-key="message" class="messageBox" name="message" placeholder="Message" required></textarea>

          <!-- Honeypot -->
          <input type="text" name="_gotcha" style="display:none">

          <button class="btn" data-key="send" type="submit">Send</button>
        </form>

        <div id="status" class="status"></div>

      </div>
    </section>
  </main>


  <footer id="footerId">
    <nav>
      <div class="copyrightNotice">
        <div>&copy; <span id="year"></span></div> </span> Carina Hollinger. <div>All rights reserved.</div>
      </div>
      <button class="nav-btn" data-target="impressum">
        Impressum
      </button>
      <div class="footerSpacer"></div>
      <script>
        document.getElementById("year").textContent = new Date().getFullYear();
      </script>
    </nav>
  </footer>

</body>

</html>
